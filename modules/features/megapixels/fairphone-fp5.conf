# Megapixels 2.x / libmegapixels device configuration for the Fairphone 5.
#
# Hardware (arch/arm64/boot/dts/qcom/qcm6490-fairphone-fp5.dts):
#   cci0_i2c0 camera@1a  sony,imx800     main,        CPHY -> csiphy0
#   cci0_i2c1 camera@29  sony,imx858     ultra-wide,  DPHY -> csiphy1
#   cci1_i2c1 camera@10  samsung,s5kjn1  front,       DPHY -> csiphy3

Version = 1;
Make: "Fairphone";
Model: "Fairphone 5";

Rear: {
	SensorDriver: "imx800";
	BridgeDriver: "qcom-camss";

	Modes: (
		{
			# drivers/media/i2c/imx800.c
			Width: 4096;
			Height: 3072;
			Rate: 30;

			Format: "BGGR10P";

			Rotate: 270;

			Pipeline: (
				{Type: "Link", From: "msm_csiphy0", FromPad: 1, To: "msm_csid0", ToPad: 0},
				{Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},

				{Type: "Mode", Entity: "imx800"},
				{Type: "Mode", Entity: "msm_csiphy0"},
				{Type: "Mode", Entity: "msm_csid0"},
				{Type: "Mode", Entity: "msm_vfe0_rdi0"}
			);
		}
	);
};

Ultrawide: {
	SensorDriver: "imx858";
	BridgeDriver: "qcom-camss";

	Modes: (
		{
			# drivers/media/i2c/imx858.c
			Width: 2048;
			Height: 1536;
			Rate: 30;
			Format: "RGGB10P";
			Rotate: 270;

			Pipeline: (
				{Type: "Link", From: "msm_csiphy1", FromPad: 1, To: "msm_csid0", ToPad: 0},
				{Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
				{Type: "Mode", Entity: "imx858"},
				{Type: "Mode", Entity: "msm_csiphy1"},
				{Type: "Mode", Entity: "msm_csid0"},
				{Type: "Mode", Entity: "msm_vfe0_rdi0"}
			);
		}
	);
};

Front: {
	SensorDriver: "s5kjn1";
	BridgeDriver: "qcom-camss";

	Modes: (
		{
			# drivers/media/i2c/s5kjn1.c
			Width: 4080;
			Height: 3072;
			Rate: 30;

			Format: "GRBG10P";

			Rotate: 270;
			Mirror: true;

			Pipeline: (
				{Type: "Link", From: "msm_csiphy3", FromPad: 1, To: "msm_csid0", ToPad: 0},
				{Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},

				{Type: "Mode", Entity: "s5kjn1"},
				{Type: "Mode", Entity: "msm_csiphy3"},
				{Type: "Mode", Entity: "msm_csid0"},
				{Type: "Mode", Entity: "msm_vfe0_rdi0"}
			);
		}
	);
};
